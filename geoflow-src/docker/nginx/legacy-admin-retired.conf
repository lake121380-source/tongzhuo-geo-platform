# 旧 Blade 后台（ADMIN_BASE_PATH，当前为 legacy-admin）**已退役**：整条前缀返回 404。
#
# 业务后端（控制器/服务/模型/队列）不删，只是不再有页面入口；React 后台在 `/geo_admin`。
# 这个文件由 default.conf.template 通过 `include .../legacy-admin-${GEOFLOW_LEGACY_ADMIN_STATE}.conf`
# 引入，改 env + `docker compose up -d web` 即切换，**不需要重建镜像**（prod 的 nginx 配置是
# 打进镜像的，重建要跑一遍 npm ci + vite build，不是秒级）。
#
# 用 `$request_uri` 而不是 `location ^~`：与本文件里 hosted 域那处既有写法保持一致
# （`# Never expose the retired administrator surface on hosted domains.`）。
# 正则 `(?:/|\?|$)` 两半都不能少：少了 `(?:/|$)` 会连 `/legacy-administration` 一起拦掉；
# 少了 `\?` 则 `/legacy-admin?x=1` 会漏过去（`$request_uri` **包含查询串**，实测漏成 302）。
if ($request_uri ~ ^/legacy-admin(?:/|\?|$)) {
    return 404;
}
