map $http_host $geoflow_forwarded_port {
    ~:([0-9]+)$ $1;
    default $server_port;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location = /manifest.webmanifest {
        access_log off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ^~ /build/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~ ^/reverb/(app|apps)/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_forwarded_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        set $geoflow_reverb reverb:8080;
        proxy_pass http://$geoflow_reverb;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|ttf|otf|woff|woff2)$ {
        access_log off;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri @geoflow_app;
    }

    # 退役拉闸：旧 Blade 后台（ADMIN_BASE_PATH，当前为 legacy-admin）已由 React 后台
    # `/geo_admin` 取代，这里对整条前缀返回 404。业务后端不删，只是没有页面入口。
    # **回滚**：删掉下面这条 + `docker exec geoflow-web nginx -s reload`，秒级。
    # 写法与 prod 模板里 hosted 域那处既有做法一致（`Never expose the retired
    # administrator surface on hosted domains.`）。正则里的 `(?:/|\?|$)` 两半都不能少：
    # 少了 `(?:/|$)` 会连 `/legacy-administration` 一起拦掉；少了 `\?` 则
    # `/legacy-admin?x=1` 会漏过去（`$request_uri` **包含查询串**，实测漏成 302）。
    if ($request_uri ~ ^/legacy-admin(?:/|\?|$)) {
        return 404;
    }

    location ^~ /ai-ui/ {
        try_files $uri =404;
    }

    # The standalone Express compatibility server is not part of the Laravel
    # deployment and must never be downloadable from the static UI directory.
    location = /ai-ui/server.cjs {
        return 404;
    }

    location = /ai-ui/server.cjs.map {
        return 404;
    }

    # Keep the enterprise website at `/`. The migrated -AI application is the
    # administration surface, while API and public discovery routes stay on
    # their original Laravel paths.
    location = /geo_admin {
        add_header Cache-Control "no-store" always;
        try_files /ai-ui/index.html =404;
    }

    location ^~ /geo_admin/ {
        add_header Cache-Control "no-store" always;
        try_files /ai-ui/index.html =404;
    }

    location / {
        try_files /__geoflow_dynamic_request__ @geoflow_app;
    }

    location @geoflow_app {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $geoflow_app app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_forwarded_port;
        proxy_read_timeout 300s;
        proxy_pass http://$geoflow_app;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
