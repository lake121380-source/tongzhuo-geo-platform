resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 64m;

root /var/www/html/public;
index index.php;

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options SAMEORIGIN;
add_header Referrer-Policy strict-origin-when-cross-origin;

location ~ /\.(?!well-known).* {
    deny all;
}

# markdown 导出准备接口：在 PHP 解析请求体**之前**就限制大小。
#
# 2026-09-12 退役改指向：这条规则原先守的是旧 Blade 后台的
# `<admin 前缀>/articles/batch/export-markdown/prepare`。旧后台退役后那条路由不复存在，
# 而 React 客户端走的是**新接口** `/api/v1/articles/markdown-export/prepare`——路径形状不同，
# 原正则匹配不到它。**不改成新路径，这层保护就会静默变成空守**（旧路径没了、新路径也没被守）。
# 版本段写成 `v\d+` 是故意的：将来升到 v2 时规则仍然生效，不会又悄悄失效一次。
location ~ ^/api/v\d+/articles/markdown-export/prepare$ {
    client_max_body_size 128k;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTPS $geoflow_https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_PROTO $geoflow_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $geoflow_forwarded_port;
    set $php_upstream app:9000;
    fastcgi_pass $php_upstream;
    fastcgi_read_timeout 300;
    internal;
}
